# docker compose up --build        (run `python -m ml.train` first so models/champion exists)
#   api        http://localhost:8000/docs
#   mlflow     http://localhost:5000
#   dashboard  http://localhost:8501
services:
  api:
    build: .
    image: student-risk-api:latest
    ports: ["8000:8000"]
    environment:
      MONITORING_DB: /data/monitoring.db
      # API_KEY: change-me          # uncomment to require X-API-Key on /predict*, /feedback
    volumes:
      - monitoring_data:/data       # prediction / request / label log shared with the monitors
    restart: unless-stopped

  mlflow:
    build: { context: ., dockerfile: Dockerfile.mlflow }
    ports: ["5000:5000"]
    volumes:
      - ./mlflow:/mlflow
    restart: unless-stopped

  dashboard:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -q -r requirements-dashboard.txt &&
             streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0"
    environment:
      API_URL: http://api:8000
      MONITORING_DB: /data/monitoring.db
    volumes:
      - .:/app
      - monitoring_data:/data:ro
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  monitoring_data:
